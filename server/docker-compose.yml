services:
  api:
    container_name: api
    image: greenscape:latest
    ports:
      - '5000:5000'
    env_file:
      - docker.env
    depends_on:
      - postgres
      - redis
  postgres:
    container_name: postgres
    image: postgres:alpine
    ports:
      - '5432:5432'
    volumes:
      - /data/postgres:/data/postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=greenscape

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - '6379:6379'

  web:
    container_name: nginx
    image: nginx:alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_HOST=greeenscape.store
      - NGINX_PORT=80
    depends_on:
      - api
